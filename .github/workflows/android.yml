name: L Android Wegert

on:
  push:
    branches:
      - android-edric-wegert
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EDRIC_REF: main
  SHADER_BACKEND_REF: 7876b79058d6f59711151a21697369c1cf72df2f

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  apk:
    needs: compilers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out shared ICK source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .ai-ci-ick

      - name: Download qualified compiler stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: build/ick-packages
          merge-multiple: true

      - name: Restore the qualified compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-x86_64.tar.gz"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'

      - name: Require native-only application source
        shell: bash
        run: |
          set -euo pipefail
          if find app/src -type f \( -name '*.java' -o -name '*.kt' \) -print | grep -q .; then
            echo 'Java/Kotlin application source found'
            exit 1
          fi
          grep -q 'android:hasCode="false"' app/src/main/AndroidManifest.xml

      - name: Check bundled Dirichlet L Wegert shader
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
          test -s app/src/main/assets/l-wegert.frag
          grep -q 'uniform vec2 u_center' app/src/main/assets/l-wegert.frag
          grep -q 'uniform int u_object' app/src/main/assets/l-wegert.frag
          grep -q 'hcl_to_srgb' app/src/main/assets/l-wegert.frag
          grep -q 'hurwitz_zeta' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi3' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi4' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi5' app/src/main/assets/l-wegert.frag
          ! grep -q 'evaluate_e4' app/src/main/assets/l-wegert.frag
          ! grep -q 'evaluate_eta3_8' app/src/main/assets/l-wegert.frag
          python3 -m json.tool data/dirichlet-l-neighbors.json > /dev/null
          grep -q '1-3-3.2-r1-0-0' data/dirichlet-l-neighbors.json
          grep -q '1-2e2-4.3-r1-0-0' data/dirichlet-l-neighbors.json
          grep -q '1-5-5.4-r0-0-0' data/dirichlet-l-neighbors.json
          glslangValidator -S frag app/src/main/assets/l-wegert.frag

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log

      - name: Verify declared source producers
        uses: isomorphisms/ai-ci@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        with:
          suite: ci/build-toolchain-suite.tsv
          root: .

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l-android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Verify APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-files"
          grep -q 'lib/arm64-v8a/libl.so' "$RUNNER_TEMP/apk-files"
          grep -q 'lib/armeabi-v7a/libl.so' "$RUNNER_TEMP/apk-files"
          grep -q 'lib/x86_64/libl.so' "$RUNNER_TEMP/apk-files"
          grep -q 'assets/l-wegert.frag' "$RUNNER_TEMP/apk-files"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulate phone and test camera-preserving navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 1280x720
            adb shell wm density 320
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.l/android.app.NativeActivity
            sleep 4
            adb exec-out screencap -p > l-chi3.png
            adb shell input tap 640 610
            sleep 2
            adb exec-out screencap -p > l-chi4.png
            adb shell input swipe 320 320 700 320 450
            sleep 2
            adb exec-out screencap -p > l-chi4-pan.png
            adb logcat -d > l-phone.log
            adb shell pidof -s org.isomorphisms.l | tr -d '\r' | grep -Eq '^[0-9]+$'
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|could not open asset|missing camera/object' l-phone.log
            grep -q 'renderer ready' l-phone.log
            grep -q 'first frame: object=0' l-phone.log
            grep -q 'selected object 1' l-phone.log
            test "$(sha256sum l-chi3.png | cut -d' ' -f1)" != "$(sha256sum l-chi4.png | cut -d' ' -f1)"
            test "$(sha256sum l-chi4.png | cut -d' ' -f1)" != "$(sha256sum l-chi4-pan.png | cut -d' ' -f1)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l-phone-emulator-evidence
          path: |
            l-chi3.png
            l-chi4.png
            l-chi4-pan.png
            l-phone.log
          if-no-files-found: warn

  shader-source:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install compiler and shader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Check out Edric
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: ${{ env.EDRIC_REF }}
          path: idric

      - name: Check out Idris shader backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/idris-shader-backend
          ref: ${{ env.SHADER_BACKEND_REF }}
          path: shader-backend

      - name: Build self-hosted Edric and compiler API
        shell: bash
        run: |
          set -euxo pipefail
          make -C idric bootstrap SCHEME=chezscheme
          make -C idric install PREFIX="$HOME/.idris2"
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C idric clean
          make -C idric all IDRIS2_BOOT="$HOME/.idris2/bin/idris2"
          make -C idric install PREFIX="$HOME/.idris2"
          make -C idric install-api PREFIX="$HOME/.idris2"
          idris2 --version

      - name: Build GLSL ES backend against Edric
        run: |
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.idris2/bin:$PATH" make -C shader-backend backend

      - name: Compile L shader source
        shell: bash
        run: |
          set -euxo pipefail
          cp shader/LWegert.idric shader-backend/src/Example/LWegert.idric
          (
            cd shader-backend
            ./build/exec/idris2-glsles \
              --cg glsles \
              --source-dir src \
              --output-dir generated \
              src/Example/LWegert.idric \
              -o l-wegert-source
          )
          test -s shader-backend/generated/l-wegert-source.frag
          glslangValidator -S frag shader-backend/generated/l-wegert-source.frag
