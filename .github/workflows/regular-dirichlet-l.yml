name: Dirichlet L evaluator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-gles:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: 9d530f4ad51f5b0a09c3e74dbe45cac5bb6d52d3
          path: .ithon
          persist-credentials: false
      - name: Install Mesa software GLES
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Compare the packaged shader with the independent reference
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: .ithon/ithon ci/l-at-one/check.pi

  generated-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      IDRIS2: ${{ github.workspace }}/.idric/_/build/exec/idris2
      IDRIS2_PREFIX: ${{ github.workspace }}/.idric/_/bootstrap-build
      CHEZ: ${{ github.workspace }}/.idric/_/.tools/bin/scheme
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned Idriç
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: .idric
          persist-credentials: false
      - name: Check out the compatible shader backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/idris-shader-backend
          ref: 93308d288ce9957d03591c3afc60f0c15c8c3ec7
          path: .shader-backend
          persist-credentials: false
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme libgmp-dev glslang-tools
      - name: Qualify ICK for compiler support
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Bootstrap Idriç
        working-directory: .idric
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./edric bootstrap
      - name: Install the compiler API
        working-directory: .idric/_
        run: |
          "$IDRIS2" --install idris2api.ipkg
      - name: Build the shader backend
        working-directory: .shader-backend
        run: make backend
      - name: Compile the checked regular-tail source
        working-directory: .shader-backend
        run: |
          cp ../examples/autogenerated/regular-hurwitz-tail/RegularHurwitzTail.idric src/Example/
          ./build/exec/idris2-glsles --cg glsles --source-dir src --output-dir generated \
            src/Example/RegularHurwitzTail.idric -o regular-hurwitz-tail
          test -s generated/regular-hurwitz-tail.frag
      - name: Validate and link the generated GLSL
        working-directory: .shader-backend
        run: glslangValidator -l fixtures/wegert-fullscreen.vert generated/regular-hurwitz-tail.frag
